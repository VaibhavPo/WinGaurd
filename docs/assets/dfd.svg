<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="WinGuard data flow diagram">
  <defs>
    <linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#E6EDF3; }
      .subtitle { font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#B6C2D1; }
      .box { fill: url(#gBox); stroke:#E2E8F0; stroke-width:1.2; rx:16; ry:16; filter:url(#shadow); }
      .boxTitle { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#0F172A; }
      .boxBody { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#334155; }
      .pill { font: 700 10px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#0B1220; }
      .pillBg { fill:#E0F2FE; stroke:#BAE6FD; }
      .arrow { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .hint { font: 600 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill:#475569; }
    </style>
  </defs>

  <!-- Header -->
  <rect x="20" y="20" width="1360" height="64" rx="16" fill="url(#gHeader)"/>
  <text x="46" y="56" class="title">WinGuard — Data Flow Diagram (DFD)</text>
  <text x="46" y="76" class="subtitle">Motion → Sensor → ESP32 → Network → FastAPI → YOLOv8 → Species Model → Rules → Database → (Planned) Decision & Alerts</text>

  <!-- Boxes row 1 -->
  <rect class="box" x="40" y="120" width="240" height="150"/>
  <text x="60" y="152" class="boxTitle">Edge Sensing (IoT)</text>
  <text x="60" y="178" class="boxBody">• PIR sensor detects motion</text>
  <text x="60" y="198" class="boxBody">• Camera captures frame</text>
  <text x="60" y="218" class="boxBody">• Timestamp + camera id</text>
  <rect x="60" y="232" width="128" height="22" rx="11" class="pillBg"/>
  <text x="72" y="247" class="pill">LOW POWER • ALWAYS ON</text>

  <rect class="box" x="320" y="120" width="240" height="150"/>
  <text x="340" y="152" class="boxTitle">ESP32 Controller</text>
  <text x="340" y="178" class="boxBody">• Reads PIR GPIO trigger</text>
  <text x="340" y="198" class="boxBody">• Controls camera power</text>
  <text x="340" y="218" class="boxBody">• Sends frame + metadata</text>
  <rect x="340" y="232" width="160" height="22" rx="11" class="pillBg"/>
  <text x="352" y="247" class="pill">NO AI INFERENCE HERE</text>

  <rect class="box" x="600" y="120" width="240" height="150"/>
  <text x="620" y="152" class="boxTitle">Network / Transport</text>
  <text x="620" y="178" class="boxBody">• Wi‑Fi / Internet</text>
  <text x="620" y="198" class="boxBody">• Transfers bytes + metadata</text>
  <text x="620" y="218" class="boxBody">• Retries when possible</text>

  <rect class="box" x="880" y="120" width="480" height="150"/>
  <text x="900" y="152" class="boxTitle">AI Backend (FastAPI • Python)</text>
  <text x="900" y="178" class="boxBody">1) API Ingress: POST /detect (raw image bytes)</text>
  <text x="900" y="198" class="boxBody">2) Preprocess: resize / normalize</text>
  <text x="900" y="218" class="boxBody">3) Detect: YOLOv8 → human vs animal (+ crops)</text>
  <text x="900" y="238" class="boxBody">4) Classify: species model on animal crop</text>

  <!-- Arrows row 1 -->
  <path class="arrow" d="M 280 195 L 320 195"/>
  <path class="arrow" d="M 560 195 L 600 195"/>
  <path class="arrow" d="M 840 195 L 880 195"/>

  <!-- Boxes row 2 -->
  <rect class="box" x="40" y="320" width="420" height="180"/>
  <text x="60" y="352" class="boxTitle">Event Storage & Audit Log</text>
  <text x="60" y="378" class="boxBody">• SQLite (prototype)</text>
  <text x="60" y="398" class="boxBody">• Stores: image path, timestamp, camera id</text>
  <text x="60" y="418" class="boxBody">• Stores: label, species, confidence</text>
  <rect x="60" y="436" width="220" height="22" rx="11" class="pillBg"/>
  <text x="72" y="451" class="pill">RELIABLE • AUDITABLE EVENTS</text>

  <rect class="box" x="500" y="320" width="420" height="180"/>
  <text x="520" y="352" class="boxTitle">Decision Support (Planned)</text>
  <text x="520" y="378" class="boxBody">• Tracking (DeepSORT / ByteTrack)</text>
  <text x="520" y="398" class="boxBody">• De‑dup + re‑entry handling</text>
  <text x="520" y="418" class="boxBody">• Zone logic: corridor vs boundary</text>

  <rect class="box" x="960" y="320" width="400" height="180"/>
  <text x="980" y="352" class="boxTitle">Alerts & Response (Planned)</text>
  <text x="980" y="378" class="boxBody">• SMS / WhatsApp</text>
  <text x="980" y="398" class="boxBody">• Siren / local warning</text>
  <text x="980" y="418" class="boxBody">• Dashboard + analytics</text>

  <!-- Arrow from backend to storage -->
  <path class="arrow" d="M 1120 270 L 250 320"/>
  <text x="520" y="304" class="hint">Structured event record (image + metadata + confidence)</text>

  <!-- Arrows row 2 -->
  <path class="arrow" d="M 460 410 L 500 410"/>
  <path class="arrow" d="M 920 410 L 960 410"/>

  <!-- Footer flow -->
  <rect x="20" y="520" width="1360" height="24" rx="12" fill="#EEF2FF" stroke="#E0E7FF"/>
  <text x="36" y="537" class="hint">Flow: Motion → Sensor → ESP32 → Camera → Backend AI → Database → Decision → Alert</text>
</svg>
